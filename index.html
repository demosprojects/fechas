<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universidad</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="https://raw.githubusercontent.com/demosprojects/fechas/main/icon-512.png" type="image/png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="estilos.css">
    
</head>
<body>

    <header>
        <h1>Agenda de Estudio</h1>
    </header>

    <div class="content">
        <!-- Botón para mostrar la hoja de cálculo de Fechas -->
        <button onclick="showSheet('https://docs.google.com/spreadsheets/d/e/2PACX-1vTXt_YmTdB04vkRVS9EisPr70Yj120rpxdD46aYKwLszi51-lUgQQcnvBiJNWCPN5qYa4QtAdcYzkw0/pubhtml')">Ver Fechas</button>

        <!-- Botón para mostrar la hoja de cálculo de Notas -->
        <button onclick="showSheet('https://docs.google.com/spreadsheets/d/e/2PACX-1vTCN0aSh6A-Wla2yqTnEBPHDIQwImGjjX0JUb1OH97Uy9_54M9NBuXgw7eQ2C02oPKaf2gE7bbEA0_y/pubhtml')">Ver Notas</button>

        <!-- Botón para mostrar la hoja de cálculo de Materias Aprobadas -->
        <button onclick="showSheet('https://docs.google.com/spreadsheets/d/e/2PACX-1vT8xFMcu_fsaKyzET9PWWFBLyT_SvMGj_4hgisxfen4u9-tfQN63Q6lAkcSj9T70O0zc5Asi_-ggOFX/pubhtml')">Ver Materias Aprobadas</button>

        <!-- Iframe donde se mostrarán las hojas de cálculo -->
        <iframe id="sheetFrame" src="" style="display: none;"></iframe>
    </div>
    
    <footer>
        <div class="content">
            <h2>Selecciona una opción para descargar:</h2>
            <div class="buttons">
                <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTXt_YmTdB04vkRVS9EisPr70Yj120rpxdD46aYKwLszi51-lUgQQcnvBiJNWCPN5qYa4QtAdcYzkw0/pub?output=xlsx" download>Descargar Fechas</a>
                <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTCN0aSh6A-Wla2yqTnEBPHDIQwImGjjX0JUb1OH97Uy9_54M9NBuXgw7eQ2C02oPKaf2gE7bbEA0_y/pub?output=xlsx" download>Descargar Notas</a>
                <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vT8xFMcu_fsaKyzET9PWWFBLyT_SvMGj_4hgisxfen4u9-tfQN63Q6lAkcSj9T70O0zc5Asi_-ggOFX/pub?output=xlsx" download>Descargar Materias aprobadas</a>
            </div>
        </div>
    </footer>

    <script>
        function showSheet(url) {
            var iframe = document.getElementById('sheetFrame');
            iframe.src = url;
            iframe.style.display = 'block';
        }
    </script>

</body>
</html>
